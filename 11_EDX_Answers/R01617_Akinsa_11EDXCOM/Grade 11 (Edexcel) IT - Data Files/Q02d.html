<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation Buttons</title>

    <style>
        /* Amend this CSS */

        .btn {
             /* Sets the button background colour to blue */
             background-color: blue;
            /* Sets the text colour to white */
            color:white;
            /* Sets the button width to 150 pixels */
            width:150px;
            /* Sets the button height to 50 pixels */ 
           height: 50px;
            /* Removes the default button border */
            border:none;

        }

        .btn:hover {
            /* Changes the button background colour to green when hovered over */
            background-color: green;
             
            /* Increases the button size by 1.1 when hovered */ 
            

        }
    </style>
</head>
<body>

    <h2>Navigation menu</h2>

    <button class="btn">Home</button>
    <button class="btn">About</button>
    <button class="btn">Contact</button>

</body>
</html>
