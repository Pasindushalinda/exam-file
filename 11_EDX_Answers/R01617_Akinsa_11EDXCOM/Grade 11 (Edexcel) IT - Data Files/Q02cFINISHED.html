<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Q02c</title>	
        <style>
            .shapes {
               position: absolute;
            }

            .container {/* Add your code to position the container here */
                background-color: grey;
                width:600px;
                height: 400px;
                top:100px;
                right:30px;
                /*end your code of positioning the container */
               position: relative;
               margin: auto;
            }

            .triangle {
               width: 120px;
               height: 120px;
               border-left: 50px solid transparent;
               border-right: 50px solid transparent;
               border-bottom: 100px solid red;

               /* Add your code to position the triangle here */
               background: red;
               position: absolute;
               top:108px;
               left:310px;
            }

            .circle {
               height: 120px;
               width: 120px;
               background: green;
               border-radius: 50%;

               /* Add your code to position the circle here */
               position: absolute;
               top:385px;
               right:370px;
            }

        </style>
    </head>
    <body>

        <div class="shapes container"></div>

        <!--Add your HTML code here!-->
        <div class="triangle"></div>
        <div class="circle"></div>




    </body>
</html>
